[package]
name = "wrobot-gui"
version = "0.4.1"
edition = "2021"
default-run = "wrobot-gui"

[dependencies]
wrobot-core = { path = "../wrobot-core" }
egui = "0.36"
eframe = "0.36"
rfd = "0.17"
calamine = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认关闭 eframe 的 wgpu，使用 glow（OpenGL）后端，依赖更少、离线更稳
default = ["eframe/glow"]
